<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión — Sistema de Asistencia</title>
  <link id="favicon" rel="icon" type="image/png" href="/static/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/main.css?v=37" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── LOGIN STITCH STYLE ─────────────────────────────────────── */

    body {
      display: flex;
      align-items: stretch;
      min-height: 100vh;
      background-color: #e8eaed;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* Wrapper centrado */
    .login-page-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 24px;
    }

    /* Tarjeta principal split */
    .login-container {
      display: flex;
      width: 100%;
      max-width: 860px;
      min-height: 440px;
      background: #ffffff;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 2px 24px rgba(0,0,0,0.10);
      animation: fadeIn 0.45s ease both;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    /* ── Panel izquierdo: formulario ── */
    .login-card-panel {
      flex: 0 0 46%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 52px 48px;
      background: #ffffff;
    }

    /* Logo area */
    .logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .logo-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .logo-icon svg { width: 36px; height: 36px; }
    .logo-brand-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: -0.01em;
      line-height: 1.1;
    }
    .logo-brand-name span {
      display: block;
      font-size: 0.72rem;
      font-weight: 500;
      color: #6b7280;
      letter-spacing: 0;
    }

    /* Título del sistema */
    .login-system-title {
      font-size: 1.45rem;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.02em;
      margin: 18px 0 28px;
      line-height: 1.2;
    }

    /* Campos */
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }
    .form-group .input-wrap {
      position: relative;
    }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #ffffff;
      color: #111827;
      font-size: 0.88rem;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
      outline: none;
    }
    .form-group input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
    }
    .form-group input::placeholder { color: #9ca3af; }

    /* Toggle contraseña */
    .pwd-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      padding: 0;
      display: flex;
      align-items: center;
    }
    .pwd-toggle:hover { color: #6b7280; }
    .form-group input[type="password"],
    .form-group input.has-toggle { padding-right: 40px; }

    /* Botón principal */
    .btn-login {
      width: 100%;
      padding: 11px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.18s ease, transform 0.15s ease;
    }
    .btn-login:hover { background: #1d4ed8; transform: translateY(-1px); }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }

    /* Link forgot */
    .forgot-link {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: 0.8rem;
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }
    .forgot-link:hover { text-decoration: underline; }

    /* Error */
    .login-error {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #dc2626;
      border-radius: 6px;
      padding: 9px 13px;
      font-size: 0.82rem;
      margin-top: 12px;
      display: none;
      font-weight: 500;
    }
    .login-error.show { display: block; animation: shake 0.3s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

    /* Footer */
    .login-footer {
      margin-top: 28px;
      font-size: 0.72rem;
      color: #9ca3af;
      font-weight: 400;
      text-align: center;
    }

    /* ── Panel derecho: imagen ── */
    .login-visual {
      flex: 1;
      position: relative;
      background: #dee1e6;
      overflow: hidden;
    }
    .login-visual img.device-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
    }

    /* Responsive */
    @media (max-width: 700px) {
      .login-container { flex-direction: column; max-width: 400px; }
      .login-visual { display: none; }
      .login-card-panel { flex: unset; padding: 40px 28px; }
    }
  </style>
</head>
<body>

<div class="login-page-wrap">
<div class="login-container">

  <!-- Panel izquierdo: formulario -->
  <div class="login-card-panel">

    <!-- Logo + marca -->
    <div class="logo-row">
      <div class="logo-icon" id="logoIconWrap">
        <!-- SVG por defecto (cruz médica / asistencia) -->
        <svg id="loginLogoSvg" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="36" height="36" rx="8" fill="#2563eb"/>
          <path d="M15 9h6v6h6v6h-6v6h-6v-6H9v-6h6V9z" fill="white"/>
        </svg>
        <img id="loginLogoImg" style="display:none; height:36px; width:auto; max-width:120px; object-fit:contain;" alt="Logo" />
      </div>
      <div class="logo-brand-name">
        <span id="loginCompanyName">Clínica / Empresa</span>
        <span id="loginSystemName" style="font-size:0.72rem;font-weight:500;color:#6b7280;">Control de Asistencia</span>
      </div>
    </div>

    <!-- Título principal -->
    <h2 class="login-system-title" id="loginMainTitle">Control de Asistencia</h2>

    <!-- Formulario -->
    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username"
               placeholder="admin" required autofocus autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password"
                 placeholder="••••••••" required autocomplete="current-password" class="has-toggle" />
          <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="Mostrar contraseña" tabindex="-1">
            <svg id="eyeIcon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
              <path d="M10 3C5 3 1.27 6.11 0 10c1.27 3.89 5 7 10 7s8.73-3.11 10-7C18.73 6.11 15 3 10 3zm0 12a5 5 0 110-10 5 5 0 010 10zm0-8a3 3 0 100 6 3 3 0 000-6z"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="btnLogin">Iniciar Sesión</button>
      <div class="login-error" id="loginError"></div>
    </form>

    <a href="#" class="forgot-link" id="forgotLink">Forgot Password?</a>

    <!-- Footer -->
    <div class="login-footer" id="loginFooter">
      Sistema de Asistencia v1.0 &mdash; Sede principal
    </div>
  </div>

  <!-- Panel derecho: foto del dispositivo biométrico -->
  <div class="login-visual">
    <img class="device-photo" id="devicePhoto"
         src="https://images.unsplash.com/photo-1614064641938-3bbee52942c7?w=800&q=80&auto=format&fit=crop"
         alt="Lector biométrico facial Hikvision"
         onerror="this.style.display='none'" />
  </div>

</div>
</div>

<script>
  if (localStorage.getItem('token')) window.location.href = '/app';

  (async () => {
    function hexToRgb(hex) {
      if (!hex) return null;
      const shorthandRegex = /^#?([a-f\d])([a-f\d])([a-f\d])$/i;
      const fullHex = hex.replace(shorthandRegex, (m, r, g, b) => r + r + g + g + b + b);
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(fullHex);
      return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : null;
    }
    function getBrightness(hex) {
      if (!hex) return 255;
      const rgb = hexToRgb(hex);
      if (!rgb) return 255;
      const parts = rgb.split(',').map(n => parseInt(n.trim(), 10));
      return (parts[0] * 299 + parts[1] * 587 + parts[2] * 114) / 1000;
    }

    try {
      const res = await fetch('/api/settings/public');
      if (res.ok) {
        const data = await res.json();
        if (data.system_name) {
          document.title = `Iniciar Sesión — ${data.system_name}`;
          const sysEl = document.getElementById('loginSystemName');
          if (sysEl) sysEl.textContent = data.system_name;
          const titleEl = document.getElementById('loginMainTitle');
          if (titleEl) titleEl.textContent = data.system_name;
        }
        if (data.company_name) {
          const co = document.getElementById('loginCompanyName');
          if (co) co.textContent = data.company_name;
          const footEl = document.getElementById('loginFooter');
          if (footEl) footEl.innerHTML = `${data.company_name} &mdash; Control de Asistencia`;
        }
        const logoIconWrap = document.getElementById('logoIconWrap');
        if (data.logo_path) {
          const svg = document.getElementById('loginLogoSvg');
          if (svg) svg.style.display = 'none';
          const img = document.getElementById('loginLogoImg');
          img.src = data.logo_path;
          img.style.display = 'block';
          if (logoIconWrap) {
            logoIconWrap.style.background = 'none';
            logoIconWrap.style.boxShadow = 'none';
          }
        }

        const pColor = data.primary_color || '#2563eb';

        // Apply primary color to button
        document.querySelectorAll('.btn-login').forEach(btn => {
          btn.style.background = pColor;
        });

        // Apply accent focus ring color via CSS var
        document.documentElement.style.setProperty('--accent', pColor);

        const faviconEl = document.getElementById('favicon');
        if (faviconEl) {
          if (data.logo_path) {
            const size = 64;
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
              const canvas = document.createElement('canvas');
              canvas.width = size; canvas.height = size;
              const ctx = canvas.getContext('2d');
              ctx.beginPath();
              ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
              ctx.closePath(); ctx.clip();
              const scale = Math.max(size / img.width, size / img.height);
              const w = img.width * scale; const h = img.height * scale;
              ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
              faviconEl.href = canvas.toDataURL('image/png');
              faviconEl.type = 'image/png';
            };
            img.onerror = () => { faviconEl.href = data.logo_path; };
            img.src = data.logo_path;
          } else {
            const initial = (data.system_name || 'A').charAt(0).toUpperCase();
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="${pColor}"/><text x="16" y="22" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">${initial}</text></svg>`;
            const blob = new Blob([svg], { type: 'image/svg+xml' });
            faviconEl.href = URL.createObjectURL(blob);
            faviconEl.type = 'image/svg+xml';
          }
        }
      }
    } catch(e) {
      console.error('Error al cargar settings de marca', e);
    }
  })();

  // Password show/hide toggle
  const pwdToggle = document.getElementById('pwdToggle');
  const pwdInput = document.getElementById('password');
  if (pwdToggle && pwdInput) {
    pwdToggle.addEventListener('click', () => {
      const isHidden = pwdInput.type === 'password';
      pwdInput.type = isHidden ? 'text' : 'password';
      pwdToggle.style.color = isHidden ? '#2563eb' : '#9ca3af';
    });
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnLogin');
    const err = document.getElementById('loginError');
    btn.disabled = true; btn.textContent = 'Entrando...'; err.classList.remove('show');
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ username: document.getElementById('username').value.trim(),
                               password: document.getElementById('password').value })
      });
      if (!res.ok) throw new Error((await res.json()).detail || 'Error');
      const data = await res.json();
      localStorage.setItem('token', data.access_token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = '/app';
    } catch(e) {
      err.textContent = e.message; err.classList.add('show');
      btn.disabled = false; btn.textContent = 'Iniciar Sesión';
    }
  });
</script>
  <script src="/js/pwa.js"></script>
</body>
</html>
