<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión — Sistema de Asistencia</title>
  <link id="favicon" rel="icon" type="image/png" href="/static/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/main.css?v=37" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bg-base, #f3f5fa);
      color: var(--text-1);
      font-family: var(--font-body, 'Plus Jakarta Sans', sans-serif);
      position: relative;
      overflow: hidden;
    }

    .login-container {
      position: relative;
      z-index: 2;
      display: flex;
      background: var(--surface-1, #ffffff);
      border: 1px solid var(--border, #d1d5db);
      width: 100%;
      max-width: 840px;
      animation: slideUp 0.55s var(--ease-out, cubic-bezier(0.16, 1, 0.3, 1));
      overflow: hidden;
    }
    @keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

    .login-visual {
      flex: 1;
      background: var(--surface-2, #f4f6fa);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 44px 36px;
      border-left: 1px solid var(--border, rgba(15, 23, 42, 0.08));
      overflow: hidden;
    }

    .visual-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(var(--accent-rgb, 37, 99, 235), 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(var(--accent-rgb, 37, 99, 235), 0.04) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.5;
    }

    .visual-grid::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 35%, transparent 40%, var(--surface-2, #f4f6fa) 100%);
    }

    .scanner-wrapper {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .viewfinder {
      position: relative;
      width: 180px;
      height: 180px;
      background: var(--surface-1, #ffffff);
      border: 1px solid var(--border, #d1d5db);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .viewfinder .corner {
      position: absolute;
      width: 14px;
      height: 14px;
      border: 2px solid var(--accent, #2563eb);
    }
    .viewfinder .corner.tl { top: -2px; left: -2px; border-right: none; border-bottom: none; border-top-left-radius: 6px; }
    .viewfinder .corner.tr { top: -2px; right: -2px; border-left: none; border-bottom: none; border-top-right-radius: 6px; }
    .viewfinder .corner.bl { bottom: -2px; left: -2px; border-right: none; border-top: none; border-bottom-left-radius: 6px; }
    .viewfinder .corner.br { bottom: -2px; right: -2px; border-left: none; border-top: none; border-bottom-right-radius: 6px; }

    .scan-line {
      position: absolute;
      left: 8px;
      right: 8px;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, var(--accent, #1d4ed8), transparent);
      box-shadow: 0 0 6px var(--accent, #1d4ed8);
      animation: scanMove 3s infinite ease-in-out;
      z-index: 3;
      border-radius: 1px;
    }

    @keyframes scanMove {
      0%, 100% { top: 10%; }
      50% { top: 90%; }
    }

    .face-mesh {
      width: 120px;
      height: 120px;
      color: var(--accent, #2563eb);
      opacity: 0.85;
      transition: color 0.3s ease;
    }

    .mesh-node {
      animation: nodePulse 2s infinite ease-in-out;
      transform-origin: center;
    }
    .mesh-node:nth-child(even) { animation-delay: 0.5s; }
    .mesh-node:nth-child(3n) { animation-delay: 1.0s; }

    @keyframes nodePulse {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.5); opacity: 1; filter: drop-shadow(0 0 3px var(--accent, #1d4ed8)); }
    }

    .tech-labels {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 200px;
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
      font-size: .64rem;
      color: #7c8da8;
    }
    .tech-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 3px;
    }
    .tech-key { font-weight: 500; }
    .tech-val { color: #cbd5e1; font-weight: 600; }
    .tech-val.active { color: #34d399; }
    .tech-val.pulse { animation: textPulse 1.5s infinite ease-in-out; }
    @keyframes textPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .login-card-panel {
      flex: 1;
      background: var(--surface-1, #ffffff);
      padding: 48px 44px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    @media (max-width: 768px) {
      .login-container {
        max-width: 400px;
        flex-direction: column;
        border-radius: 20px;
        margin: 16px;
      }
      .login-visual { display: none; }
      .login-card-panel { padding: 36px 28px; }
    }

    .logo-row { display:flex; align-items:center; gap:14px; margin-bottom:32px; }
    .logo-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm, 9px);
      background: linear-gradient(145deg, #2563eb, var(--accent, #1d4ed8));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(29, 78, 216, 0.3);
    }
    .logo-row h1 {
      font-family: var(--font-display, 'Sora', sans-serif);
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-1);
      line-height: 1.25;
      margin: 0;
      letter-spacing: -0.01em;
    }
    .logo-row p { font-size:.75rem; color:var(--text-3); margin:3px 0 0; font-weight: 500; }

    .form-group { margin-bottom:20px; }
    .form-group label {
      display:block;
      font-size:.7rem;
      font-weight:600;
      color:var(--text-2);
      margin-bottom:6px;
      letter-spacing:.04em;
      text-transform:uppercase;
    }
    .form-group input {
      width:100%;
      padding:11px 14px;
      border-radius:var(--radius-sm, 9px);
      background: var(--surface-2, #eef1f7);
      border: 1px solid var(--border, rgba(15, 23, 42, 0.07));
      color: var(--text-1);
      font-size: .86rem;
      transition: all 0.22s var(--ease-out, cubic-bezier(0.16, 1, 0.3, 1));
      box-sizing: border-box;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(var(--accent-rgb, 29, 78, 216), 0.12);
      background: var(--bg-raised, #ffffff);
    }
    .form-group input::placeholder { color: var(--text-3); }

    .btn-login {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--accent, #0055ff);
      cursor: pointer;
      background: var(--accent, #0055ff);
      color: #fff;
      font-size: .86rem;
      font-weight: 600;
      transition: all 0.22s var(--ease-out, cubic-bezier(0.16, 1, 0.3, 1));
      margin-top: 8px;
      position: relative;
      overflow: hidden;
      font-family: var(--font-display, 'Archivo', sans-serif);
      box-shadow: none;
    }
    .btn-login:hover {
      background: #0044cc;
      border-color: #0044cc;
      transform: translateY(-1px);
    }
    .btn-login:disabled { opacity:.6; cursor:not-allowed; transform:none; }

    .btn-login::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        to bottom right,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0) 40%,
        rgba(255, 255, 255, 0.10) 50%,
        rgba(255, 255, 255, 0) 60%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(30deg);
      transition: transform 0.8s ease;
      pointer-events: none;
    }
    .btn-login:hover::after {
      transform: translate(15%, 15%) rotate(30deg);
    }

    .login-error {
      background: rgba(255, 109, 0, 0.06);
      border: 1px solid rgba(255, 109, 0, 0.2);
      color: var(--danger);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: .82rem;
      margin-top: 14px;
      display: none;
      font-weight: 500;
    }
    .login-error.show { display:block; animation: shake 0.35s ease; }
    @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-4px);} 75% {transform: translateX(4px);} }

    .login-footer { margin-top:24px; text-align:center; font-size:.76rem; color:var(--text-3); font-weight:500; }
    @keyframes slideDownIntro { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .welcome-intro { animation: slideDownIntro 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; animation-delay: 0.1s; }

    .swipe-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: .62rem;
      font-weight: 600;
      color: var(--text-3);
      letter-spacing: .1em;
      text-transform: uppercase;
      opacity: 0.7;
      z-index: 2;
      font-family: var(--font-mono, 'IBM Plex Mono', monospace);
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-card-panel">
    <div class="logo-row">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px;stroke:#fff;" id="loginLogoSvg">
          <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
          <line x1="9" y1="22" x2="9" y2="16"></line>
          <line x1="15" y1="22" x2="15" y2="16"></line>
          <line x1="9" y1="16" x2="15" y2="16"></line>
          <circle cx="12" cy="7" r="2"></circle>
        </svg>
        <img id="loginLogoImg" style="display: none; width: 28px; height: 28px; object-fit: contain;" />
      </div>
      <div><h1 id="loginSystemName">Control de Asistencia</h1><p id="loginCompanyName">Hikvision DS-K1T323MBWX</p></div>
    </div>
    <p style="font-family:var(--font-display,'Sora',sans-serif);font-size:1.3rem;font-weight:600;color:var(--text-1);margin:0 0 4px;letter-spacing:-0.02em;">Bienvenido</p>
    <p style="font-size:.84rem;color:var(--text-3);margin:0 0 26px;font-weight:500;">Ingresa tus credenciales para continuar</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" placeholder="admin" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-login" id="btnLogin">Iniciar sesión</button>
      <div class="login-error" id="loginError"></div>
    </form>

    <div class="login-footer" id="loginFooter">Sistema de Asistencia v1.0 &mdash; Sede principal</div>
  </div>

  <div class="login-visual">
    <div class="visual-grid"></div>
    <div class="scanner-wrapper">
      <div class="viewfinder">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div class="scan-line"></div>

        <svg class="face-mesh" viewBox="0 0 100 100" fill="none" stroke="currentColor">
          <path d="M25,35 Q20,55 35,75 T50,85 T65,75 T75,35 Q70,20 50,20 T25,35 Z" stroke-width="0.5" stroke-dasharray="1 1" opacity="0.25" />
          <path d="M30,38 Q26,53 38,70 T50,78 T62,70 T70,38 Q66,26 50,26 T30,38 Z" stroke-width="0.75" opacity="0.5" />
          <path d="M34,42 Q39,40 44,42" stroke-width="0.75" />
          <path d="M56,42 Q61,40 66,42" stroke-width="0.75" />
          <circle cx="39" cy="45" r="1.5" fill="currentColor" />
          <circle cx="61" cy="45" r="1.5" fill="currentColor" />
          <path d="M50,44 L50,58 L46,58 M50,58 L54,58" stroke-width="0.75" />
          <path d="M42,66 Q50,70 58,66" stroke-width="0.75" />
          <line x1="39" y1="45" x2="50" y2="30" stroke-width="0.5" opacity="0.25" />
          <line x1="61" y1="45" x2="50" y2="30" stroke-width="0.5" opacity="0.25" />
          <line x1="39" y1="45" x2="30" y2="52" stroke-width="0.5" opacity="0.25" />
          <line x1="61" y1="45" x2="70" y2="52" stroke-width="0.5" opacity="0.25" />
          <line x1="30" y1="52" x2="38" y2="70" stroke-width="0.5" opacity="0.25" />
          <line x1="70" y1="52" x2="62" y2="70" stroke-width="0.5" opacity="0.25" />
          <circle class="mesh-node" cx="50" cy="30" r="1.8" fill="currentColor" />
          <circle class="mesh-node" cx="39" cy="45" r="1.8" fill="currentColor" />
          <circle class="mesh-node" cx="61" cy="45" r="1.8" fill="currentColor" />
          <circle class="mesh-node" cx="30" cy="52" r="1.8" fill="currentColor" />
          <circle class="mesh-node" cx="70" cy="52" r="1.8" fill="currentColor" />
          <circle class="mesh-node" cx="38" cy="70" r="1.8" fill="currentColor" />
          <circle class="mesh-node" cx="62" cy="70" r="1.8" fill="currentColor" />
          <circle class="mesh-node" cx="50" cy="78" r="1.8" fill="currentColor" />
        </svg>
      </div>

      <div class="welcome-intro" style="text-align: center; max-width: 250px; margin-top: 4px;">
        <p style="font-size: 0.78rem; color: var(--text-3); margin: 0; line-height: 1.55; font-weight: 500;">
          Control centralizado de asistencia en tiempo real, conectado a tu terminal biométrico facial.
        </p>
      </div>
    </div>
    <div class="swipe-hint">Verificación biométrica</div>
  </div>
</div>

<script>
  if (localStorage.getItem('token')) window.location.href = '/app';

  (async () => {
    function hexToRgb(hex) {
      if (!hex) return null;
      const shorthandRegex = /^#?([a-f\d])([a-f\d])([a-f\d])$/i;
      const fullHex = hex.replace(shorthandRegex, (m, r, g, b) => r + r + g + g + b + b);
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(fullHex);
      return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : null;
    }
    function getBrightness(hex) {
      if (!hex) return 255;
      const rgb = hexToRgb(hex);
      if (!rgb) return 255;
      const parts = rgb.split(',').map(n => parseInt(n.trim(), 10));
      return (parts[0] * 299 + parts[1] * 587 + parts[2] * 114) / 1000;
    }

    try {
      const res = await fetch('/api/settings/public');
      if (res.ok) {
        const data = await res.json();
        if (data.system_name) {
          document.title = `Iniciar Sesión — ${data.system_name}`;
          document.getElementById('loginSystemName').textContent = data.system_name;
        }
        if (data.company_name) {
          document.getElementById('loginCompanyName').textContent = data.company_name;
          document.getElementById('loginFooter').innerHTML = `${data.company_name} &mdash; Control de Asistencia`;
        }
        const logoIcon = document.querySelector('.logo-icon');
        if (data.logo_path) {
          document.getElementById('loginLogoSvg').style.display = 'none';
          const img = document.getElementById('loginLogoImg');
          img.src = data.logo_path;
          img.style.display = 'block';
          if (logoIcon) {
            logoIcon.style.background = 'none';
            logoIcon.style.boxShadow = 'none';
            logoIcon.style.width = 'auto';
            logoIcon.style.height = '44px';
            logoIcon.style.borderRadius = '0';
            img.style.width = 'auto';
            img.style.height = '100%';
            img.style.maxWidth = '160px';
            img.style.objectFit = 'contain';
          }
        }

        const base = data.bg_base_color || '#f3f5fa';
        const surface = data.bg_surface_color || '#ffffff';
        const pColor = data.primary_color || '#1d4ed8';
        const aColor = data.accent_color || '#0a1020';

        const lightBase = base && getBrightness(base) >= 210 ? base : '#f7f8fb';
        document.documentElement.style.setProperty('--bg-base', lightBase);
        document.documentElement.style.setProperty('--bg-raised', '#ffffff');
        document.documentElement.style.setProperty('--surface-1', '#ffffff');
        document.documentElement.style.setProperty('--surface-2', '#f4f6fa');
        document.documentElement.style.setProperty('--surface-3', '#e9edf4');
        document.documentElement.style.setProperty('--text-1', '#0f172a');
        document.documentElement.style.setProperty('--text-2', '#475569');
        document.documentElement.style.setProperty('--text-3', '#94a3b8');
        document.documentElement.style.setProperty('--border', 'rgba(15, 23, 42, 0.08)');
        document.documentElement.style.setProperty('--border-light', 'rgba(15, 23, 42, 0.12)');

        document.documentElement.style.setProperty('--accent', pColor);
        const pRgb = hexToRgb(pColor);
        if (pRgb) {
          document.documentElement.style.setProperty('--accent-rgb', pRgb);
          document.documentElement.style.setProperty('--border-glow', `rgba(${pRgb}, 0.08)`);
        }

        document.documentElement.style.setProperty('--accent-2', aColor);
        const aRgb = hexToRgb(aColor);
        if (aRgb) {
          document.documentElement.style.setProperty('--accent-2-rgb', aRgb);
        }

        document.body.style.backgroundImage = `radial-gradient(circle at 10% 20%, rgba(${pRgb || '37, 99, 235'}, 0.025) 0%, ${lightBase} 100%)`;

        const faviconEl = document.getElementById('favicon');
        if (faviconEl) {
          if (data.logo_path) {
            const size = 64;
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
              const canvas = document.createElement('canvas');
              canvas.width = size; canvas.height = size;
              const ctx = canvas.getContext('2d');
              ctx.beginPath();
              ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
              ctx.closePath(); ctx.clip();
              const scale = Math.max(size / img.width, size / img.height);
              const w = img.width * scale; const h = img.height * scale;
              ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
              faviconEl.href = canvas.toDataURL('image/png');
              faviconEl.type = 'image/png';
            };
            img.onerror = () => { faviconEl.href = data.logo_path; };
            img.src = data.logo_path;
          } else {
            const initial = (data.system_name || 'A').charAt(0).toUpperCase();
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="${pColor}"/><text x="16" y="22" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">${initial}</text></svg>`;
            const blob = new Blob([svg], { type: 'image/svg+xml' });
            faviconEl.href = URL.createObjectURL(blob);
            faviconEl.type = 'image/svg+xml';
          }
        }
      }
    } catch(e) {
      console.error('Error al cargar settings de marca', e);
    }
  })();

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnLogin');
    const err = document.getElementById('loginError');
    btn.disabled = true; btn.textContent = 'Entrando...'; err.classList.remove('show');
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ username: document.getElementById('username').value.trim(),
                               password: document.getElementById('password').value })
      });
      if (!res.ok) throw new Error((await res.json()).detail || 'Error');
      const data = await res.json();
      localStorage.setItem('token', data.access_token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = '/app';
    } catch(e) {
      err.textContent = e.message; err.classList.add('show');
      btn.disabled = false; btn.textContent = 'Iniciar sesión';
    }
  });
</script>
  <script src="/js/pwa.js"></script>
</body>
</html>
