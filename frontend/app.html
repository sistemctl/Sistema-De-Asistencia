<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Asistencia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app-shell">
  <!-- ── SIDEBAR ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-icon">🏢</div>
      <div class="sidebar-brand-text">
        <strong>Asistencia</strong>
        <span>DS-K1T323MBWX</span>
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-label">Principal</div>
      <div class="nav-item active" data-page="dashboard" id="nav-dashboard">
        <span class="icon">📊</span> Dashboard
      </div>
      <div class="nav-item" data-page="attendance" id="nav-attendance">
        <span class="icon">📋</span> Asistencia
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-label">Gestión</div>
      <div class="nav-item" data-page="employees" id="nav-employees">
        <span class="icon">👥</span> Empleados
      </div>
      <div class="nav-item" data-page="reports" id="nav-reports">
        <span class="icon">📈</span> Reportes
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-label">Sistema</div>
      <div class="nav-item" data-page="device" id="nav-device">
        <span class="icon">📡</span> Dispositivo
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="user-chip" id="userChip">
        <div class="user-avatar" id="userAvatar">A</div>
        <div class="user-info">
          <strong id="userName">Admin</strong>
          <span id="userRole">Administrador</span>
        </div>
        <button class="logout-btn" id="logoutBtn" title="Cerrar sesión">⏻</button>
      </div>
    </div>
  </aside>

  <!-- ── MAIN ── -->
  <div class="main">
    <header class="topbar">
      <span class="topbar-title" id="topbarTitle">Dashboard</span>
      <span class="topbar-subtitle" id="topbarSubtitle"></span>
      <div class="topbar-right">
        <div class="device-badge offline" id="deviceBadge">
          <span class="status-dot"></span>
          <span id="deviceBadgeText">Verificando...</span>
        </div>
        <button class="btn btn-sm btn-secondary" id="syncBtn" title="Sincronizar ahora">⟳ Sync</button>
      </div>
    </header>

    <main class="content" id="pageContent">
      <div class="loading-overlay"><div class="spinner"></div></div>
    </main>
  </div>
</div>

<!-- ── TOAST CONTAINER ── -->
<div class="toast-container" id="toastContainer"></div>

<!-- ── MODAL GENÉRICO ── -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Modal</span>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/employees.js"></script>
<script src="/js/attendance.js"></script>
<script src="/js/reports.js"></script>
<script src="/js/device.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
